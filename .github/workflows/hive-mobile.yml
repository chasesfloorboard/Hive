name: Hive Mobile

# Builds Hive Mobile when its code changes on main, and when its version (versionCode in
# mobile/android/app/build.gradle.kts) is newer than the one in the "hive-mobile" release,
# replaces that release's HiveMobile.apk and HiveMobile.json. Installed copies update from there
# when Hive on the PC can't be reached.
#
# The APK is signed with the HIVE_MOBILE_KEYSTORE secret (a base64 Android keystore whose key is
# "androiddebugkey", passwords "android", as Android's debug keystore), passed to the build as
# HIVE_KEYSTORE, and checked before it's published. Without the secret it
# still builds and tests, but publishes nothing: a phone only accepts updates signed by its key.

on:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/hive-mobile.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hive-mobile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Signing key
        env:
          KEY: ${{ secrets.HIVE_MOBILE_KEYSTORE }}
        run: |
          if [ -n "$KEY" ]; then
            # Given to the build by its path (build.gradle.kts reads HIVE_KEYSTORE): Android's default debug
            # keystore was not reliably the one used, and each build came out with a key of its own.
            printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/hive.keystore"
            echo "HIVE_KEYSTORE=$RUNNER_TEMP/hive.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::notice::No HIVE_MOBILE_KEYSTORE secret: building and testing only."
          fi

      - name: Test and build
        working-directory: mobile/android
        # Only the "mobile" edition (Hive Mobile, F-Droid/sideload) ships from here. Hive Clean is the
        # Google Play edition and is published separately as a signed AAB with an offline upload key.
        run: bash gradlew --no-daemon testMobileDebugUnitTest assembleMobileRelease

      # Never publishes an APK a phone would refuse: it must be signed by the key it was given.
      - name: Check the signing key
        if: env.SIGNED == '1'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          want=$(keytool -list -v -keystore "$HIVE_KEYSTORE" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')
          got=$("$apksigner" verify --print-certs mobile/android/app/build/outputs/apk/mobile/release/app-mobile-release.apk | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: *//')
          echo "key given: $want"; echo "APK signed: $got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::The APK isn't signed with HIVE_MOBILE_KEYSTORE's key"; exit 1; }

      - name: Publish when newer
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gradle=mobile/android/app/build.gradle.kts
          code=$(grep -oP 'versionCode = \K[0-9]+' "$gradle")
          name=$(grep -oP 'versionName = "\K[^"]+' "$gradle")
          published=$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/hive-mobile/HiveMobile.json" | jq -r '.versionCode // 0' || echo 0)
          if [ "$code" -le "${published:-0}" ]; then
            echo "Hive Mobile $name ($code) is not newer than the release ($published); nothing to publish."
            exit 0
          fi
          cp mobile/android/app/build/outputs/apk/mobile/release/app-mobile-release.apk HiveMobile.apk
          jq -n --argjson code "$code" --arg name "$name" --argjson size "$(stat -c %s HiveMobile.apk)" --arg sha "$(sha256sum HiveMobile.apk | cut -d' ' -f1)" \
            '{versionCode:$code, versionName:$name, size:$size, sha256:$sha}' > HiveMobile.json
          cat HiveMobile.json
          gh release upload hive-mobile --clobber -R "$GITHUB_REPOSITORY" HiveMobile.apk HiveMobile.json

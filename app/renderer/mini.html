<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' mbcover: data:; img-src 'self' mbcover: data: https:; style-src 'self' 'unsafe-inline'; script-src 'self';">
<title>Hive Mini Player</title>
<style>
  :root{--bg:#101116;--panel:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--text:#ece9f2;--dim:#9a97a8;--accent:hsl(220 6% 62%)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
  body{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 12px;-webkit-app-region:drag;
    background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),var(--bg)}
  .cover{width:76px;height:76px;border-radius:8px;background:var(--panel) center/cover no-repeat;box-shadow:0 6px 18px rgba(0,0,0,.4);display:grid;place-items:center;color:var(--dim);font-size:26px}
  .main{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .top{display:flex;gap:8px;align-items:flex-start}
  .meta{flex:1;min-width:0}
  .title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .artist{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .win{display:flex;gap:2px}
  button{-webkit-app-region:no-drag;background:transparent;border:0;color:var(--text);cursor:pointer;border-radius:7px;display:grid;place-items:center}
  button:hover{background:rgba(255,255,255,.08)}
  .win button{width:22px;height:22px;color:var(--dim);font-size:12px}
  .controls{display:flex;align-items:center;gap:4px}
  .controls button{width:32px;height:30px}
  .controls button.play{width:36px;height:34px;background:color-mix(in srgb,var(--accent) 28%,transparent)}
  .controls button.loved{color:#ff6b8b}
  svg{width:18px;height:18px}
  .time{margin-left:auto;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
  .bar{height:4px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;cursor:pointer;-webkit-app-region:no-drag;margin-top:4px}
  .bar > div{height:100%;width:0;background:var(--accent)}
</style>
</head>
<body>
  <div class="cover" id="cover">♪</div>
  <div class="main">
    <div class="top">
      <div class="meta"><div class="title" id="title">Nothing playing</div><div class="artist" id="artist"></div></div>
      <div class="win"><button id="pin" title="Keep on top">⇡</button><button id="open" title="Open Hive">⤢</button><button id="close" title="Close mini player">✕</button></div>
    </div>
    <div class="controls">
      <button id="prev" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 6v12l-10-6z"/></svg></button>
      <button id="play" class="play" title="Play/Pause"></button>
      <button id="next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 6v12l10-6z"/></svg></button>
      <button id="love" title="Love"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
      <span class="time" id="time"></span>
    </div>
    <div class="bar" id="bar"><div id="fill"></div></div>
  </div>
<script src="mini.js"></script>
</body>
</html>
